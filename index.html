<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus IDE - Serverless Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
      <span>Nexus IDE</span>
    </div>
    <div id="user-badge" class="badge">Status: Guest</div>
  </nav>

  <div id="toast" class="toast hidden"></div>

  <main class="layout">
    <aside class="sidebar">
      <div id="panel-auth" class="panel">
        <h3>Aktivasi Workspace</h3>
        <p class="desc">Masukkan email untuk membuka akses IDE.</p>
        <input type="email" id="input-email" class="input-modern" placeholder="email@domain.com">
        <button id="btn-auth" class="btn btn-primary" onclick="app.activate()">Mulai Coding</button>
      </div>

      <div id="panel-config" class="panel hidden">
        <h3>Konfigurasi Project</h3>
        <label>Project ID (URL Slug)</label>
        <input type="text" id="input-project" class="input-modern" placeholder="ex: landing-page-v1">
        <div class="action-grid">
          <button id="btn-save" class="btn btn-primary" onclick="app.save()">Simpan Code</button>
          <button id="btn-publish" class="btn btn-success" onclick="app.publish()">Publish & Lihat</button>
        </div>
      </div>

      <div id="panel-ai" class="panel hidden">
        <h3>✨ Gemini AI Assistant</h3>
        <p class="desc">Ketik apa yang ingin Anda buat, AI akan menulis kodenya.</p>
        <textarea id="input-prompt" class="input-modern" placeholder="Contoh: Buatkan form login keren..." style="height: 80px; resize: none;"></textarea>
        <button id="btn-ai" class="btn btn-purple" onclick="app.askGemini()">Generate Kode</button>
      </div>
    </aside>

    <section class="editor-area">
      <div class="editor-header">
        <span class="tab active">index.html</span>
      </div>
      <textarea id="input-code" class="code-editor" placeholder="<!-- Mulai ketik HTML/JS/CSS Anda di sini -->&#10;<h1>Halo Dunia</h1>"></textarea>
      
      <div class="terminal-container">
        <div class="terminal-header">Terminal Output</div>
        <div id="terminal-log" class="terminal-body">> Menunggu sistem siap...</div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
