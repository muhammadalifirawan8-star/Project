<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Builder Workspace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loader" class="hidden"><div class="spinner"></div><p id="loader-text">Memproses...</p></div>

  <header>
    <div class="logo">🚀 WebBuilder Workspace</div>
    <div class="account-status" id="accountStatus">Status: Belum Aktif (Menunggu Pembayaran)</div>
  </header>

  <main class="workspace">
    <!-- Sidebar: project-builder.js concept -->
    <aside class="sidebar">
      <h3>File Manager</h3>
      <ul id="fileList">
        <li class="active" onclick="ide.switchFile('html')">index.html</li>
        <li onclick="ide.switchFile('css')">style.css</li>
        <li onclick="ide.switchFile('js')">script.js</li>
      </ul>
      <button class="btn btn-activate" onclick="account.activate()">Simulasi Bayar & Aktivasi</button>
    </aside>

    <!-- IDE Area: browser-ide.js concept -->
    <section class="editor-area">
      <div class="toolbar">
        <span id="currentFileLabel">index.html</span>
        <button class="btn btn-run" onclick="ide.runProject()">▶ Run Preview</button>
        <button class="btn btn-publish" onclick="publisher.publish()">☁ Publish (publish.sh)</button>
      </div>
      <textarea id="codeEditor" spellcheck="false" placeholder="Tulis kode Anda di sini..."></textarea>
      
      <!-- Log Panel -->
      <div class="log-panel" id="logPanel">Console Log siap...</div>
    </section>

    <!-- Preview Panel -->
    <section class="preview-area">
      <iframe id="previewFrame" title="Project Preview"></iframe>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
