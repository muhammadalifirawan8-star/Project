<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Web Builder & IDE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">
    <header>
      <h1>Web Builder Workspace</h1>
      <div id="status-badge" class="badge">Status: Guest</div>
    </header>

    <!-- Notifikasi Global -->
    <div id="notification" class="hidden"></div>

    <main>
      <!-- Panel Aktivasi (akun.json) -->
      <section id="panel-activation" class="card">
        <h2>Aktivasi Instan</h2>
        <p>Konfirmasi pembayaran dan langsung gunakan workspace.</p>
        <input type="email" id="email-input" placeholder="Masukkan Email Anda">
        <button id="btn-activate" onclick="appModule.activateAccount()">Aktivasi Sekarang</button>
      </section>

      <!-- Panel IDE & Builder (project-builder.js & browser-ide.js) -->
      <section id="panel-ide" class="card hidden">
        <h2>Browser IDE</h2>
        <input type="text" id="project-id" placeholder="Nama Project (ex: landing-page-1)">
        <textarea id="code-editor" placeholder="<!-- Tulis kode HTML/JS Anda di sini -->"></textarea>
        
        <div class="action-group">
          <button id="btn-save" class="btn-primary" onclick="appModule.saveProject()">Simpan Perubahan</button>
          <button id="btn-publish" class="btn-secondary" onclick="appModule.publishProject()">Publish Project</button>
        </div>
        
        <div id="log-console" class="console">
          > Menunggu perintah...
        </div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
